site_name: GuanSheng的个人网站
site_url: https://guansheng.github.io/mymkdocs/
site_author: GuanSheng
theme:
  name: material
  features:
    - navigation.expand
plugins:
  - search

markdown_extensions:
  - toc

  - pymdownx.arithmatex:  # 此扩展负责识别公式语法
      generic: true       # 设置为 true，将公式原样传给前端库处理



extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js # MathJax 3 核心库


extra:
  analytics:
    provider: google
    property: G-7PTMCYKC09
